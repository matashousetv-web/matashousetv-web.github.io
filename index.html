<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baxter Bikes Radio</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: #eaeaea;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.radio {
    width: 420px;
    height: 320px;
    background: linear-gradient(145deg, #111, #000);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 25px rgba(0,0,0,0.9),
                inset 0 0 10px rgba(255,255,255,0.05);
}

.title {
    text-align: center;
    font-weight: bold;
    color: #00aaff;
    margin-bottom: 10px;
}

.now {
    text-align: center;
    margin: 20px 0;
}

.song {
    font-size: 18px;
    font-weight: bold;
}

.artist {
    font-size: 14px;
    opacity: 0.6;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
}

button {
    background: #111;
    border: none;
    color: #fff;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 10px rgba(0,170,255,0.2);
}

button:hover {
    box-shadow: 0 0 15px rgba(0,170,255,0.6);
}

/* Volume Section */
.volume-container {
    margin-top: 20px;
    text-align: center;
}

.volume-label {
    font-size: 12px;
    opacity: 0.7;
}

.volume-value {
    font-size: 14px;
    margin-bottom: 5px;
}

/* Slider styling */
input[type=range] {
    -webkit-appearance: none;
    width: 80%;
    height: 6px;
    background: #222;
    border-radius: 5px;
    outline: none;
}

input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    background: #00aaff;
    border-radius: 50%;
    box-shadow: 0 0 10px #00aaff;
    cursor: pointer;
}

.footer {
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="radio">

    <div class="title">🔥 BAXTER BIKES RADIO 🔥</div>

    <div class="now">
        <div class="song">Built Not Bought</div>
        <div class="artist">Self Made 6 Years Deep In The Game!</div>
    </div>

    <div class="controls">
        <button onclick="play()">▶</button>
        <button onclick="pause()">⏸</button>
    </div>

    <!-- Volume Section -->
    <div class="volume-container">
        <div class="volume-value" id="volDisplay">Volume: 100%</div>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1"
               oninput="setVolume(this.value)">
    </div>

    <audio id="player">
        <source src="http://stream.zeno.fm/cmqbv5vff0hvv" type="audio/mpeg">
    </audio>

    <div class="footer">
        AKA Script Daddy Romin 😎
    </div>

</div>

<script>
function play() {
    document.getElementById("player").play();
}

function pause() {
    document.getElementById("player").pause();
}

function setVolume(val) {
    const player = document.getElementById("player");
    player.volume = val;

    // Update display (0–1 → 0–100%)
    let percent = Math.round(val * 100);
    document.getElementById("volDisplay").innerText = "Volume: " + percent + "%";
}
</script>

</body>
</html>
