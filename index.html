<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baxter Bikes Radio</title>

<style>
body {
    margin: 0;
    background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("https://matashousetv-web.github.io/background.jpg");
    background-size: cover;
    background-position: center;

    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* BOOT */
#bootScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    color: gold;
    font-size: 24px;
}

/* RADIO */
.radio {
    width: 460px;
    background: #000;
    border-radius: 20px;
    padding: 20px;
    transition: box-shadow 0.4s ease;
}

/* TITLE */
.title {
    text-align: center;
    color: gold;
    font-weight: bold;
    text-shadow: 0 0 15px gold;
}

/* LIVE */
.live {
    text-align: center;
    color: red;
    font-size: 12px;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
}

/* STATION NAME */
#stationName {
    text-align: center;
    font-size: 14px;
    margin-top: 5px;
}

/* SIGNAL */
.signal {
    text-align: right;
    font-size: 14px;
    opacity: 0.6;
}

/* VISUALIZER */
.visualizer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 10px;
    height: 80px;
    margin: 20px 0;
}

.bar {
    width: 14px;
    height: 10px;
    background: gold;
    transition: height 0.1s, background 0.4s;
}

/* CONTROLS */
.controls {
    text-align: center;
}

button {
    margin: 5px;
    padding: 8px;
    border-radius: 10px;
    background: #111;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 10px white;
}

/* PRESETS */
.presets {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
}

.preset.active {
    box-shadow: 0 0 15px gold;
    border: 1px solid gold;
}

/* VOLUME */
.volume-container {
    text-align: center;
}
</style>
</head>

<body>

<div id="bootScreen">BAXTER SYSTEM</div>

<div class="radio">

<div class="signal">▂ ▄ ▆ █</div>

<div class="title">🔥 BAXTER RADIO 🔥</div>
<div class="live">● LIVE</div>
<div id="stationName">BAXTER RADIO</div>

<div class="visualizer">
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>

<div class="controls">
<button onclick="play()">▶</button>
<button onclick="pause()">⏸</button>
<button onclick="stop()">⏹</button>
</div>

<div class="presets">
<button class="preset" onclick="setStation('http://stream.zeno.fm/cmqbv5vff0hvv','baxter',this,'BAXTER')">BAXTER</button>

<button class="preset" onclick="setStation('https://playerservices.streamtheworld.com/api/livestream-redirect/WIYYFMAAC.aac','red',this,'ROCK')">ROCK</button>

<button class="preset" onclick="setStation('http://mp3channels.webradio.rockantenne.de/heavy-metal','orange',this,'METAL')">METAL</button>

<button class="preset" onclick="setStation('https://ais-sa2.cdnstream1.com/1976_128.mp3','green',this,'COUNTRY')">COUNTRY</button>

<button class="preset" onclick="setStation('https://playerservices.streamtheworld.com/api/livestream-redirect/WQHTFM.mp3','blue',this,'R&B')">R&B</button>

<button class="preset" onclick="setStation('https://icecast.radiofrance.fr/fip-midfi.mp3','purple',this,'ALT')">ALT</button>
</div>

<div class="volume-container">
<input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
</div>

<audio id="player" src="http://stream.zeno.fm/cmqbv5vff0hvv"></audio>

</div>

<script>
let currentColor="gold";
let vizInterval=null;
const player=document.getElementById("player");

/* CONTROLS */
function play(){player.play();}
function pause(){player.pause();}
function stop(){player.pause();player.currentTime=0;}

/* VOLUME */
function setVolume(v){
player.volume=v;
document.querySelector(".radio").style.boxShadow=
"0 0 "+(v*60)+"px "+(currentColor==="baxter"?"gold":currentColor);
}

/* STATION */
function setStation(url,color,btn,name){
player.src=url;
player.play();
applyTheme(color);
document.getElementById("stationName").innerText=name;

document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}

/* THEME */
function applyTheme(color){
const radio=document.querySelector(".radio");
const bars=document.querySelectorAll(".bar");

if(color==="baxter"){
radio.style.boxShadow="0 0 40px blue, inset 0 0 25px gold";
bars.forEach(b=>b.style.background="linear-gradient(to top,blue,gold)");
currentColor="baxter";
return;
}

radio.style.boxShadow="0 0 40px "+color;
bars.forEach(b=>b.style.background=color);
currentColor=color;
}

/* VISUALIZER */
player.addEventListener("play",()=>{
if(vizInterval)return;
const bars=document.querySelectorAll(".bar");
vizInterval=setInterval(()=>{
bars.forEach(b=>b.style.height=(Math.random()*60+10)+"px");
},100);
});

player.addEventListener("pause",()=>{
clearInterval(vizInterval);
vizInterval=null;
});

/* AUTO RESTART */
player.addEventListener("pause",()=>{
setTimeout(()=>{if(player.paused)player.play().catch(()=>{});},3000);
});

/* BOOT */
setTimeout(()=>{document.getElementById("bootScreen").style.display="none";},2000);
</script>

</body>
</html>
