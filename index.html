<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baxter Bikes Radio</title>

<style>
body {
    margin: 0;
    background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        radial-gradient(circle at center, rgba(255,0,0,0.2), transparent 70%),
        url("https://matashousetv-web.github.io/background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* BOOT SCREEN */
#bootScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999;
    color: #ff2a2a;
    transition: opacity 0.5s ease;
}

.bootLogo {
    font-size: 26px;
    text-shadow: 0 0 15px #ff2a2a;
}

/* RADIO PANEL */
.radio {
    width: 450px;
    height: 420px;
    background: radial-gradient(circle at center, #111 0%, #000 80%);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 40px rgba(255,0,0,0.25);
}

/* TITLE */
.title {
    text-align: center;
    color: #ff2a2a;
    text-shadow: 0 0 10px #ff2a2a;
}

/* VISUALIZER */
.visualizer {
    display: flex;
    justify-content: center;
    gap: 4px;
    height: 50px;
    margin: 10px 0;
}

.bar {
    width: 6px;
    background: #ff2a2a;
    box-shadow: 0 0 10px red;
}

/* CONTROLS */
.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    background: #111;
    border: none;
    color: #fff;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 15px red;
}

#muteBtn.active {
    box-shadow: 0 0 20px red;
}

/* PRESETS */
.presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 15px;
}

.preset {
    font-size: 11px;
    padding: 8px;
}

/* VOLUME */
.volume-container {
    text-align: center;
    margin-top: 10px;
}

input[type=range] {
    width: 80%;
}

/* FOOTER */
.footer {
    text-align: center;
    font-size: 11px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div id="bootScreen">
  <div class="bootLogo">BAXTER SYSTEM</div>
</div>

<div class="radio">

<div class="title">🔥 BAXTER RADIO 🔥</div>

<div class="visualizer">
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>

<div class="controls">
<button onclick="play()">▶</button>
<button onclick="pause()">⏸</button>
<button onclick="stop()">⏹</button>
<button onclick="toggleMute()" id="muteBtn">🔊</button>
</div>

<!-- PRESET BUTTONS -->
<div class="presets">
<button class="preset" onclick="setStation('http://stream.zeno.fm/cmqbv5vff0hvv')">BAXTER</button>
<button class="preset" onclick="setStation('https://stream.radioparadise.com/aac-320')">ROCK</button>
<button class="preset" onclick="setStation('http://stream.antenne.de:80/heavy-metal')">METAL</button>
<button class="preset" onclick="setStation('http://listen.181fm.com/181-realcountry_128k.mp3')">COUNTRY</button>
<button class="preset" onclick="setStation('https://stream.rm.fm/rnb')">R&B</button>
<button class="preset" onclick="setStation('http://radio.streemlion.com:4200/stream')">ALT ROCK</button>
</div>

<div class="volume-container">
<div id="volDisplay">Volume: 100%</div>
<input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
</div>

<audio id="player" src="http://stream.zeno.fm/cmqbv5vff0hvv"></audio>

<div class="footer">Script Daddy Romin 😎</div>

</div>

<script>
let vizInterval = null;
const player = document.getElementById("player");

/* VISUALIZER SYNC */
player.addEventListener("play", startVisualizer);
player.addEventListener("pause", stopVisualizer);

/* CONTROLS */
function play(){ player.play(); }
function pause(){ player.pause(); }
function stop(){
player.pause();
player.currentTime = 0;
}

function toggleMute(){
player.muted = !player.muted;
document.getElementById("muteBtn").classList.toggle("active");
}

function setVolume(val){
player.volume = val;
document.getElementById("volDisplay").innerText = "Volume: " + Math.round(val*100)+"%";
}

/* CHANGE STATION */
function setStation(url){
player.src = url;
player.play();
}

/* VISUALIZER */
function startVisualizer(){
if(vizInterval) return;

const bars = document.querySelectorAll(".bar");

vizInterval = setInterval(()=>{
bars.forEach(bar=>{
bar.style.height = (Math.random()*40+5)+"px";
});
},100);
}

function stopVisualizer(){
clearInterval(vizInterval);
vizInterval = null;

document.querySelectorAll(".bar").forEach(bar=>{
bar.style.height = "10px";
});
}

/* BOOT SCREEN */
setTimeout(()=>{
document.getElementById("bootScreen").style.display="none";
},2000);
</script>

</body>
</html>
