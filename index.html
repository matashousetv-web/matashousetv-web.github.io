<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baxter Bikes Radio</title>

<style>
body {
    margin: 0;
    background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("https://matashousetv-web.github.io/background.jpg");
    background-size: cover;
    background-position: center;

    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.radio {
    width: 460px;
    background: #000;
    border-radius: 20px;
    padding: 20px;
    transition: box-shadow 0.3s ease;
}

.title {
    text-align: center;
    color: gold;
    font-weight: bold;
    text-shadow: 0 0 15px gold;
}

.visualizer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 10px;
    height: 80px;
    margin: 20px 0;
}

.bar {
    width: 14px;
    height: 10px;
    background: gold;
    transition: height 0.1s, background 0.3s;
}

button {
    margin: 5px;
    padding: 8px;
    border-radius: 10px;
    background: #111;
    color: white;
    border: none;
    cursor: pointer;
}

.presets {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
}

.volume {
    text-align:center;
    margin-top:10px;
}

input[type=range] {
    width: 80%;
}
</style>
</head>

<body>

<div class="radio">

<div class="title">🔥 BAXTER RADIO 🔥</div>

<div class="visualizer">
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>

<div style="text-align:center;">
<button onclick="play()">▶</button>
<button onclick="pause()">⏸</button>
<button onclick="stop()">⏹</button>
</div>

<div class="presets">
<button onclick="setStation('http://stream.zeno.fm/cmqbv5vff0hvv','baxter')">BAXTER</button>
<button onclick="setStation('https://playerservices.streamtheworld.com/api/livestream-redirect/WIYYFMAAC.aac','red')">ROCK</button>
<button onclick="setStation('http://mp3channels.webradio.rockantenne.de/heavy-metal','orange')">METAL</button>
<button onclick="setStation('https://ais-sa2.cdnstream1.com/1976_128.mp3','green')">COUNTRY</button>
<button onclick="setStation('https://playerservices.streamtheworld.com/api/livestream-redirect/WQHTFM.mp3','blue')">R&B</button>
<button onclick="setStation('https://icecast.radiofrance.fr/fip-midfi.mp3','purple')">ALT</button>
</div>

<div class="volume">
<input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
</div>

<audio id="player"></audio>

</div>

<script>
let player = document.getElementById("player");
let currentColor = "gold";

let bars = document.querySelectorAll(".bar");
let vizInterval = null;

/* VISUALIZER CONTROL */
function startVisualizer(){
    if(vizInterval) return;

    vizInterval = setInterval(()=>{
        bars.forEach(b=>{
            b.style.height = (Math.random()*60+10)+"px";
        });
    },100);
}

function stopVisualizer(){
    clearInterval(vizInterval);
    vizInterval = null;

    bars.forEach(b=>{
        b.style.height = "10px";
    });
}

/* CONTROLS */
function play(){
    player.play();
    startVisualizer();
}

function pause(){
    player.pause();
    stopVisualizer();
}

function stop(){
    player.pause();
    stopVisualizer();

    player.removeAttribute("src");
    player.load();
}

/* STATION */
function setStation(url, color){
    player.src = url;
    player.load();
    player.play();
    applyTheme(color);
    startVisualizer();
}

/* 🔥 CLEAN BAXTER COLORS */
function setVolume(v){
    player.volume = v;

    const radio = document.querySelector(".radio");

    if(currentColor === "baxter"){
        radio.style.boxShadow =
            "0 0 " + (v*60) + "px rgba(0,120,255,0.95), " + // 🔵 blue strong
            "0 0 " + (v*25) + "px rgba(255,215,0,0.9)";    // 🟡 gold accent
        return;
    }

    radio.style.boxShadow = "0 0 " + (v*60) + "px " + currentColor;
}

/* THEMES */
function applyTheme(color){
    const radio = document.querySelector(".radio");

    if(color === "baxter"){
        radio.style.boxShadow =
            "0 0 45px rgba(0,120,255,0.95), " + // 🔵 outer blue
            "0 0 20px rgba(255,215,0,0.9)";     // 🟡 inner gold

        bars.forEach(b=>{
            b.style.background = "linear-gradient(to top, #0078ff, #ffd700)";
        });

        currentColor = "baxter";
        return;
    }

    radio.style.boxShadow = "0 0 40px " + color;

    bars.forEach(b=>{
        b.style.background = color;
    });

    currentColor = color;
}
</script>

</body>
</html>
