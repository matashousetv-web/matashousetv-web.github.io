<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baxter Bikes Radio</title>

<style>
body {
    margin: 0;
    background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("https://matashousetv-web.github.io/background.jpg");
    background-size: cover;
    background-position: center;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* RADIO */
.radio {
    width: 460px;
    background: #000;
    border-radius: 20px;
    padding: 20px;
    transition: box-shadow 0.3s ease;
}

/* TITLE */
.title {
    text-align: center;
    color: gold;
    font-weight: bold;
    text-shadow: 0 0 15px gold;
}

/* VISUALIZER */
.visualizer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 10px;
    height: 80px;
    margin: 20px 0;
}

.bar {
    width: 14px;
    height: 10px;
    background: gold;
    transition: height 0.1s, background 0.3s;
}

/* BUTTONS */
button {
    margin: 5px;
    padding: 8px;
    border-radius: 10px;
    background: #111;
    color: white;
    border: none;
    cursor: pointer;
}

/* PRESETS */
.presets {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
}

.preset.active {
    box-shadow: 0 0 15px gold;
}

/* KNOB */
.knob {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(#333, #000);
    margin: 15px auto;
    position: relative;
    cursor: pointer;
}

.knob::after {
    content: '';
    width: 4px;
    height: 25px;
    background: gold;
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 2px;
}
</style>
</head>

<body>

<div class="radio">

<div class="title">🔥 BAXTER RADIO 🔥</div>

<div class="visualizer">
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>

<div style="text-align:center;">
<button onclick="play()">▶</button>
<button onclick="pause()">⏸</button>
<button onclick="stop()">⏹</button>
</div>

<div class="presets">
<button class="preset" onclick="setStation('http://stream.zeno.fm/cmqbv5vff0hvv','baxter',this)">BAXTER</button>
<button class="preset" onclick="setStation('https://playerservices.streamtheworld.com/api/livestream-redirect/WIYYFMAAC.aac','red',this)">ROCK</button>
<button class="preset" onclick="setStation('https://ais-sa2.cdnstream1.com/1976_128.mp3','green',this)">COUNTRY</button>
<button class="preset" onclick="setStation('https://playerservices.streamtheworld.com/api/livestream-redirect/WQHTFM.mp3','blue',this)">R&B</button>
<button class="preset" onclick="setStation('https://icecast.radiofrance.fr/fip-midfi.mp3','purple',this)">ALT</button>
</div>

<div class="knob" id="knob"></div>

<audio id="player" src="http://stream.zeno.fm/cmqbv5vff0hvv"></audio>

</div>

<script>
let player = document.getElementById("player");
let currentColor = "gold";

/* CONTROLS */
function play(){player.play();}
function pause(){player.pause();}
function stop(){player.pause();player.currentTime=0;}

/* STATION */
function setStation(url,color,btn){
player.src=url;
player.play();
applyTheme(color);

document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}

/* THEME */
function applyTheme(color){
const radio=document.querySelector(".radio");
const bars=document.querySelectorAll(".bar");

if(color==="baxter"){
radio.style.boxShadow="0 0 40px blue, 0 0 60px gold";
bars.forEach(b=>b.style.background="linear-gradient(to top,blue,gold)");
currentColor="baxter";
return;
}

radio.style.boxShadow="0 0 40px "+color;
bars.forEach(b=>b.style.background=color);
currentColor=color;
}

/* 🔥 FIXED VOLUME SYSTEM */
function setVolume(v){
player.volume=v;

const radio=document.querySelector(".radio");

if(currentColor==="baxter"){
radio.style.boxShadow=
"0 0 "+(v*40)+"px blue, "+
"0 0 "+(v*60)+"px gold";
return;
}

radio.style.boxShadow="0 0 "+(v*60)+"px "+currentColor;
}

/* KNOB CONTROL */
let knob=document.getElementById("knob");

knob.addEventListener("mousemove",(e)=>{
if(e.buttons!==1)return;

let rect=knob.getBoundingClientRect();
let x=e.clientX-rect.left-rect.width/2;
let y=e.clientY-rect.top-rect.height/2;

let angle=Math.atan2(y,x)*(180/Math.PI);
let rotation=angle+135;

if(rotation<0)rotation=0;
if(rotation>270)rotation=270;

knob.style.transform=`rotate(${rotation}deg)`;

let volume=rotation/270;
setVolume(volume);
});

/* VISUALIZER */
let bars=document.querySelectorAll(".bar");
setInterval(()=>{
bars.forEach(b=>b.style.height=(Math.random()*60+10)+"px");
},100);
</script>

</body>
</html>
