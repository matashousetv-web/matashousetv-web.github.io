<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baxter Bikes Radio</title>

<style>
body {
    margin: 0;
    background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        radial-gradient(circle at center, rgba(255,0,0,0.2), transparent 70%),
        url("https://matashousetv-web.github.io/background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* BOOT */
#bootScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    color: red;
    font-size: 24px;
}

/* RADIO */
.radio {
    width: 460px;
    height: 440px;
    background: radial-gradient(circle at center, #111 0%, #000 80%);
    border-radius: 20px;
    padding: 20px;

    box-shadow: 0 0 20px red,
                inset 0 0 20px red;

    transition: box-shadow 0.3s ease;
}

.title {
    text-align: center;
    color: red;
    transition: color 0.3s ease;
}

/* VISUALIZER */
.visualizer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 10px;
    height: 80px;
    margin: 20px 0;
}

.bar {
    width: 14px;
    min-height: 10px;
    background: red;
    border-radius: 4px;
    box-shadow: 0 0 20px red;
    transition: background 0.3s, box-shadow 0.3s;
}

/* CONTROLS */
.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    background: #111;
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 15px currentColor;
}

#muteBtn.active {
    box-shadow: 0 0 20px currentColor;
}

/* PRESETS */
.presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 15px;
}

/* VOLUME */
.volume-container {
    text-align: center;
    margin-top: 10px;
}

/* FOOTER */
.footer {
    text-align: center;
    font-size: 11px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div id="bootScreen">BAXTER SYSTEM</div>

<div class="radio">

<div class="title">🔥 BAXTER RADIO 🔥</div>

<div class="visualizer">
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
<div class="bar"></div><div class="bar"></div>
</div>

<div class="controls">
<button onclick="play()">▶</button>
<button onclick="pause()">⏸</button>
<button onclick="stop()">⏹</button>
<button onclick="toggleMute()" id="muteBtn">🔊</button>
</div>

<!-- PRESETS WITH COLORS -->
<div class="presets">
<button onclick="setStation('http://stream.zeno.fm/cmqbv5vff0hvv','red')">BAXTER</button>

<button onclick="setStation('https://s6-webradio.rockantenne.de/rockantenne','red')">ROCK</button>

<button onclick="setStation('http://mp3channels.webradio.rockantenne.de/heavy-metal','orange')">METAL</button>

<button onclick="setStation('https://ais-sa2.cdnstream1.com/1976_128.mp3','green')">COUNTRY</button>

<button onclick="setStation('https://playerservices.streamtheworld.com/api/livestream-redirect/WQHTFM.mp3','blue')">R&B</button>

<button onclick="setStation('https://icecast.radiofrance.fr/fip-midfi.mp3','purple')">ALT</button>
</div>

<div class="volume-container">
<div id="volDisplay">Volume: 100%</div>
<input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
</div>

<audio id="player" src="http://stream.zeno.fm/cmqbv5vff0hvv"></audio>

<div class="footer">Script Daddy Romin 😎</div>

</div>

<script>
let vizInterval = null;
let currentColor = "red";
const player = document.getElementById("player");

/* SYNC */
player.addEventListener("play", startVisualizer);
player.addEventListener("pause", stopVisualizer);

/* CONTROLS */
function play(){ player.play(); }
function pause(){ player.pause(); }
function stop(){
    player.pause();
    player.currentTime = 0;
}

function toggleMute(){
    player.muted = !player.muted;
    document.getElementById("muteBtn").classList.toggle("active");
}

/* STATION + COLOR */
function setStation(url, color){
    player.src = url;
    player.play();

    currentColor = color;
    applyTheme(color);
}

/* THEME SYSTEM */
function applyTheme(color){
    const radio = document.querySelector(".radio");
    const bars = document.querySelectorAll(".bar");
    const title = document.querySelector(".title");

    radio.style.boxShadow =
        "0 0 40px " + color + ", inset 0 0 20px " + color;

    title.style.color = color;

    bars.forEach(bar => {
        bar.style.background = color;
        bar.style.boxShadow = "0 0 15px " + color;
    });
}

/* VOLUME */
function setVolume(val){
    player.volume = val;

    let percent = Math.round(val * 100);
    document.getElementById("volDisplay").innerText = "Volume: " + percent + "%";

    const radio = document.querySelector(".radio");

    radio.style.boxShadow =
        "0 0 " + (val * 60) + "px " + currentColor +
        ", inset 0 0 25px " + currentColor;
}

/* VISUALIZER */
function startVisualizer(){
    if(vizInterval) return;

    const bars = document.querySelectorAll(".bar");

    vizInterval = setInterval(()=>{
        bars.forEach(bar=>{
            bar.style.height = (Math.random()*70 + 10) + "px";
        });
    },100);
}

function stopVisualizer(){
    clearInterval(vizInterval);
    vizInterval = null;

    document.querySelectorAll(".bar").forEach(bar=>{
        bar.style.height = "10px";
    });
}

/* BOOT */
setTimeout(()=>{
    document.getElementById("bootScreen").style.display="none";
},2000);
</script>

</body>
</html>
