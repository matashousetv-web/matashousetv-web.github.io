<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baxter Bikes Radio</title>

<style>
body {
    margin: 0;
    background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("https://matashousetv-web.github.io/background.jpg");
    background-size: cover;
    background-position: center;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* RADIO */
.radio {
    width: 460px;
    background: #000;
    border-radius: 20px;
    padding: 20px;
    transition: box-shadow 0.3s ease;
}

/* TITLE */
.title {
    text-align: center;
    color: gold;
    font-weight: bold;
    text-shadow: 0 0 15px gold;
}

/* VISUALIZER */
.visualizer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 10px;
    height: 80px;
    margin: 20px 0;
}

.bar {
    width: 14px;
    height: 10px;
    background: gold;
    transition: height 0.1s, background 0.3s;
}

/* BUTTONS */
button {
    margin: 5px;
    padding: 8px;
    border-radius: 10px;
    background: #111;
    color: white;
    border: none;
    cursor: pointer;
}

/* PRESETS */
.presets {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
}

.preset.active {
    box-shadow: 0 0 15px gold;
}

/* 🎚 SLIDER (clean + modern) */
.volume-container {
    text-align: center;
    margin-top: 15px;
}

input[type=range] {
    width: 80%;
    height: 6px;
    background: #222;
    border-radius: 5px;
    outline: none;
}

input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: gold;
    border-radius: 50%;
    box-shadow: 0 0 10px gold;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="radio">

<div class="title">🔥 BAXTER RADIO 🔥</div>

<div class="visualizer">
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>

<div style="text-align:center;">
<button onclick="play()">▶</button>
<button onclick="pause()">⏸</button>
<button onclick="stop()">⏹</button>
</div>

<div class="presets">
<button class="preset" onclick="setStation('http://stream.zeno.fm/cmqbv5vff0hvv','baxter',this)">BAXTER</button>
<button class="preset" onclick="setStation('https://playerservices.streamtheworld.com/api/livestream-redirect/WIYYFMAAC.aac','red',this)">ROCK</button>
<button class="preset" onclick="setStation('https://ais-sa2.cdnstream1.com/1976_128.mp3','green',this)">COUNTRY</button>
<button class="preset" onclick="setStation('https://playerservices.streamtheworld.com/api/livestream-redirect/WQHTFM.mp3','blue',this)">R&B</button>
<button class="preset" onclick="setStation('https://icecast.radiofrance.fr/fip-midfi.mp3','purple',this)">ALT</button>
</div>

<!-- 🎚 SLIDER BACK -->
<div class="volume-container">
<input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
</div>

<audio id="player" src="http://stream.zeno.fm/cmqbv5vff0hvv"></audio>

</div>

<script>
let player = document.getElementById("player");
let currentColor = "gold";

/* CONTROLS */
function play(){player.play();}
function pause(){player.pause();}
function stop(){player.pause();player.currentTime=0;}

/* STATION */
function setStation(url,color,btn){
player.src=url;
player.play();
applyTheme(color);

document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}

/* THEME */
function applyTheme(color){
const radio=document.querySelector(".radio");
const bars=document.querySelectorAll(".bar");

if(color==="baxter"){
radio.style.boxShadow="0 0 40px blue, 0 0 40px gold";
bars.forEach(b=>b.style.background="linear-gradient(to top,blue,gold)");
currentColor="baxter";
return;
}

radio.style.boxShadow="0 0 40px "+color;
bars.forEach(b=>b.style.background=color);
currentColor=color;
}

/* 🔥 FIXED VOLUME (DUAL COLOR WORKS) */
function setVolume(v){
player.volume=v;

const radio=document.querySelector(".radio");

if(currentColor==="baxter"){
radio.style.boxShadow=
"0 0 "+(v*50)+"px rgba(0,120,255,0.9), "+
"0 0 "+(v*50)+"px rgba(255,215,0,0.9), "+
"inset 0 0 20px rgba(255,215,0,0.6)";
return;
}

radio.style.boxShadow="0 0 "+(v*60)+"px "+currentColor;
}

/* VISUALIZER */
let bars=document.querySelectorAll(".bar");
setInterval(()=>{
bars.forEach(b=>b.style.height=(Math.random()*60+10)+"px");
},100);
</script>

</body>
</html>
