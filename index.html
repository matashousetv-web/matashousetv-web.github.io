<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baxter Bikes Radio</title>

<style>
body {
    margin: 0;
    background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        radial-gradient(circle at center, rgba(255,0,0,0.2), transparent 70%),
        url("https://matashousetv-web.github.io/background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* RADIO PANEL */
.radio {
    width: 430px;
    height: 360px;
    background: radial-gradient(circle at center, #111 0%, #000 80%);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 40px rgba(255,0,0,0.25),
                inset 0 0 20px rgba(255,0,0,0.1);
}

/* HEADER */
.title {
    text-align: center;
    font-weight: bold;
    color: #ff2a2a;
    text-shadow: 0 0 12px #ff2a2a;
}

/* NOW PLAYING */
.now {
    text-align: center;
    margin: 15px 0;
}

.song {
    font-size: 18px;
    font-weight: bold;
}

.artist {
    font-size: 13px;
    opacity: 0.6;
}

/* VISUALIZER */
.visualizer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 4px;
    height: 50px;
    margin: 10px 0;
}

.bar {
    width: 6px;
    height: 10px;
    background: #ff2a2a;
    border-radius: 2px;
    box-shadow: 0 0 10px #ff2a2a;
    transition: height 0.1s;
}

/* CONTROLS */
.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
}

button {
    background: #111;
    border: none;
    color: #fff;
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,0,0,0.3);
    transition: 0.2s;
}

button:hover {
    box-shadow: 0 0 20px rgba(255,0,0,0.9);
}

/* MUTE ACTIVE */
#muteBtn.active {
    box-shadow: 0 0 20px rgba(255,0,0,1);
}

/* VOLUME */
.volume-container {
    margin-top: 15px;
    text-align: center;
}

.volume-value {
    font-size: 14px;
}

input[type=range] {
    -webkit-appearance: none;
    width: 80%;
    height: 6px;
    background: #222;
    border-radius: 5px;
}

input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    background: #ff2a2a;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff2a2a;
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="radio">

    <div class="title">🔥 BAXTER BIKES RADIO 🔥</div>

    <div class="now">
        <div class="song">Built Not Bought</div>
        <div class="artist">Self Made 6 Years Deep In The Game!</div>
    </div>

    <!-- VISUALIZER -->
    <div class="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <button onclick="play()">▶</button>
        <button onclick="pause()">⏸</button>
        <button onclick="stop()">⏹</button>
        <button onclick="toggleMute()" id="muteBtn">🔊</button>
    </div>

    <!-- VOLUME -->
    <div class="volume-container">
        <div class="volume-value" id="volDisplay">Volume: 100%</div>
        <input type="range" min="0" max="1" step="0.01" value="1"
               oninput="setVolume(this.value)">
    </div>

    <audio id="player">
        <source src="http://stream.zeno.fm/cmqbv5vff0hvv" type="audio/mpeg">
    </audio>

    <div class="footer">
        AKA Script Daddy Romin 😎
    </div>

</div>

<script>
let vizInterval;

function play() {
    const player = document.getElementById("player");
    player.play();
    startVisualizer();
}

function pause() {
    const player = document.getElementById("player");
    player.pause();
    stopVisualizer();
}

function stop() {
    const player = document.getElementById("player");
    player.pause();
    player.currentTime = 0;
    stopVisualizer();
}

function toggleMute() {
    const player = document.getElementById("player");
    const btn = document.getElementById("muteBtn");

    player.muted = !player.muted;

    if (player.muted) {
        btn.innerText = "🔇";
        btn.classList.add("active");
    } else {
        btn.innerText = "🔊";
        btn.classList.remove("active");
    }
}

function setVolume(val) {
    const player = document.getElementById("player");
    player.volume = val;

    let percent = Math.round(val * 100);
    document.getElementById("volDisplay").innerText = "Volume: " + percent + "%";
}

/* VISUALIZER */
function startVisualizer() {
    const bars = document.querySelectorAll(".bar");

    vizInterval = setInterval(() => {
        bars.forEach(bar => {
            let height = Math.random() * 45 + 5;
            bar.style.height = height + "px";
        });
    }, 100);
}

function stopVisualizer() {
    clearInterval(vizInterval);
    document.querySelectorAll(".bar").forEach(bar => {
        bar.style.height = "10px";
    });
}
</script>

</body>
</html>
